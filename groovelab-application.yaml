apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: groovelab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/arunhotra/deployment-groovelab'
    targetRevision: groove
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: groovelab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
